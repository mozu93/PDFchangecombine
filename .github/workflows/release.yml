name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify release notes exist
        shell: bash
        run: test -f "RELEASE_NOTES_${{ steps.tag.outputs.TAG }}.md"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Sync installer version with tag
        shell: pwsh
        run: |
          $content = Get-Content installer\setup.iss -Raw
          $content = $content -replace 'AppVersion=[\d.]+', "AppVersion=${{ steps.tag.outputs.VERSION }}"
          Set-Content installer\setup.iss $content -NoNewline

      - name: Build executable
        run: pyinstaller PDFchangecombine.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Create installer output directory
        run: New-Item -ItemType Directory -Force dist\installer

      - name: Build installer
        run: iscc installer\setup.iss

      - name: Prepare release notes
        shell: bash
        run: |
          {
            echo "インストーラー（\`PDFConverter-setup.exe\`）をダウンロードして実行してください。"
            echo ""
            cat "RELEASE_NOTES_${{ steps.tag.outputs.TAG }}.md"
          } > release_body.md

      - name: Create GitHub Release
        run: |
          gh release create ${{ steps.tag.outputs.TAG }} `
            dist\installer\PDFConverter-setup.exe `
            --title "PDF変換・結合ツール ${{ steps.tag.outputs.TAG }}" `
            --notes-file release_body.md
        env:
          GH_TOKEN: ${{ github.token }}
